# Version catalog. Every version here was verified to resolve on Maven Central
# on 2026-07-26 — see the notes on skew below before bumping anything.

[versions]
kotlin = "2.4.10"
coroutines = "1.11.0"

# protoc and the protobuf runtimes must move together — there is no documented
# cross-version tolerance between them.
protobuf = "4.35.1"
protobufPlugin = "0.10.0"

# grpc-kotlin lags grpc-java badly: grpc-kotlin-stub 1.5.0 declares grpc-stub
# 1.62.2 as an ordinary compile dependency. That is a FLOOR, not a ceiling —
# Gradle resolves to the highest requested version, so declaring grpc 1.82.1
# below wins and the Kotlin stub layer rides on top of it. If a future
# grpc-java bump breaks the generated Kotlin, pin `grpc` down to grpcKotlin's
# declared version rather than pinning grpcKotlin up.
grpc = "1.82.1"
grpcKotlin = "1.5.0"

# MUST match the netty that grpc-netty pulls transitively — check with
# `./gradlew :cri:dependencies --configuration runtimeClasspath | grep io.netty`
# after any grpc bump. A mismatch between the epoll native library and netty
# core fails at runtime, not at build time.
netty = "4.1.133.Final"

# The API is what library modules depend on; the binding is :app's alone, and
# both ship from the same slf4j release at the same version, so there is no skew
# question to get wrong. `slf4j-simple` rather than logback because it adds no
# transitive dependency of its own and needs no XML: this program's log output
# is a dozen structured lines per server lifecycle, not something anybody routes
# or filters at the appender. Swapping in logback later changes one runtimeOnly
# line and one properties file — nothing that logs.
slf4j = "2.0.17"

# YAML 1.2 parser for :schema. Chosen over kaml/Jackson because the schema
# reports *all* validation problems in one pass with field paths and line
# numbers, which needs the composed node tree (marks included), not a
# fail-fast object binder. Verified on Maven Central 2026-07-26: 3.0.1 is the
# current release, it still ships the `org.snakeyaml.engine.v2` package of the
# 2.x line (the major bump did not rename it), and it declares no runtime
# dependencies of its own.
snakeyamlEngine = "3.0.1"

sqliteJdbc = "3.53.2.0"

# The Velocity API the shipped control plugin (:velocity-plugin) compiles
# against. Verified on repo.papermc.io 2026-08-04: 4.0.0 is the newest real
# release (4.1.0 is SNAPSHOT-only, and most of the 3.x line was never published
# as anything but a SNAPSHOT), so this is the newest pin under which the plugin
# JAR is reproducible.
#
# This is not an ordinary compile pin. The JAR this module builds is loaded by
# whichever Velocity the operator's proxy image runs, so the pin is a *runtime*
# contract with an image nothing in this build can see. Velocity 4 is an API
# break from 3.x; a 3.x proxy will not load a JAR compiled here. Bumping this
# means re-running :app:integrationTest against a proxy image on the new line —
# a compile against the new artifact proves nothing about the old one.
#
# 4.0.0's Gradle module metadata declares org.gradle.jvm.version = 25, which is
# why :velocity-plugin needs no toolchain of its own: the proxy this JAR is
# loaded into runs the same JVM the rest of this repo targets. That is a
# property of *this* pin and not of Velocity generally — 3.5.1 declares 21 — so
# a downgrade to the 3.x line is also a jvmTarget change in that module, and
# Gradle will say so rather than silently producing bytecode the proxy cannot
# load.
#
# velocity-api pulls Adventure 5.2.0, Gson 2.14.0, Guava, Guice, SnakeYAML and
# slf4j-api transitively, and the proxy already has all of them. That is why the
# dependency is `compileOnly` there and why the plugin JAR shades none of it:
# two Adventure versions on one plugin classloader is a runtime failure that no
# build here would catch.
velocity = "4.0.0"

spotless = "8.8.0"
junit = "5.14.4"
kotest = "6.1.5"

# Provenance for the vendored CRI proto. Not Gradle dependencies — these record
# which .proto is checked in at cri/src/main/proto/, and must be bumped together
# with it. Full details in cri/PROTO_SOURCE.md; procedure in the
# generate-cri-stubs skill.
# containerd 2.3.3 depends on k8s.io/cri-api v0.36.0, so the vendored proto is
# kubernetes/cri-api @ v0.36.0 : pkg/apis/runtime/v1/api.proto
containerd = "2.3.3"
criApi = "0.36.0"

[libraries]
# --- build-logic classpath (consumed by buildSrc) ---
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# --- runtime ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }

grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
# Non-shaded netty + the native epoll transport: the CRI endpoint is a Unix
# domain socket, which needs epoll on Linux. grpc-netty-shaded relocates its
# netty packages, so the stock native transport cannot bind to it.
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }
# The native transport itself. Without this, grpc-netty has the UDS *API*
# (netty-transport-native-unix-common) but no implementation to run it on, and
# a DomainSocketAddress channel fails at runtime. Classifier is per-arch; add
# linux-aarch_64 alongside if this ever has to run on arm64.
netty-transportNativeEpoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }
# In-process transport: lets :cri's tests drive the real wrapper against a fake
# CRI server with no socket, no netty and no containerd. Test-only.
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
# The one binding, and only :app may depend on it. A library module that pulls a
# binding onto the classpath decides logging for every consumer it ever has.
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

snakeyaml-engine ={ module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyamlEngine" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

# compileOnly in :velocity-plugin and nowhere else. It is the only dependency in
# this build that does not come from Maven Central — see the scoped papermc
# repository in settings.gradle.kts.
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }

# --- proto codegen (consumed by :cri's protobuf block; see the skill) ---
# protoc and protoc-gen-grpc-java resolve as native executables via the
# os-detector classifier the protobuf plugin supplies by default.
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
grpc-protocGenJava = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
# NOTE: this one is a plain JAR, so it needs the `jdk8` classifier and an
# explicit @jar type when referenced from the protobuf plugin's `plugins` block.
grpc-protocGenKotlin = { module = "io.grpc:protoc-gen-grpc-kotlin", version.ref = "grpcKotlin" }

# --- test ---
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
