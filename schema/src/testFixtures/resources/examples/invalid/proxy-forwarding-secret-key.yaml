# Expected: spec.forwardingSecret — inline secrets are not supported
#
# The Velocity spelling an operator reaches for after reading velocity.toml. It
# is not a field here, and it must not be reported as a plain "unknown field":
# the answer is the secret store, not a typo fix.
apiVersion: mcorch.dev/v1alpha1
kind: VelocityProxy
metadata:
  name: proxy-01
spec:
  image: docker.io/itzg/mc-proxy:2026.6.1
  forwardingSecret: <not-supported-name-it-in-the-secret-store>
  resources:
    memory: 1Gi
  forwarding:
    secret:
      name: fleet-forwarding
      key: modern-forwarding
  backends:
    selector:
      matchLabels:
        mcorch.dev/fleet: main
