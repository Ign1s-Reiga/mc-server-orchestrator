# Expected: spec.forwarding.secret — inline secrets are not supported
#
# The literal spelling of the one invariant that is written down most explicitly:
# the Velocity forwarding secret only ever travels through the secret store.
apiVersion: mcorch.dev/v1alpha1
kind: VelocityProxy
metadata:
  name: proxy-01
spec:
  image: docker.io/itzg/mc-proxy:2026.6.1
  resources:
    memory: 1Gi
  forwarding:
    secret: <not-supported-name-it-in-the-secret-store>
  backends:
    selector:
      matchLabels:
        mcorch.dev/fleet: main
