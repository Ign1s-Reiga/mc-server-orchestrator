# The second `memory` silently winning is how a server ends up with a limit
# nobody chose.
# Expected: spec.resources.memory — is declared more than once
apiVersion: mcorch.dev/v1alpha1
kind: PaperServer
metadata:
  name: survival-01
spec:
  network:
    rcon:
      passwordSecret:
        name: survival-01-rcon
        key: password
  eulaAccepted: true
  image: docker.io/itzg/minecraft-server:2026.6.1
  paper:
    minecraftVersion: "1.21.8"
  resources:
    memory: 4Gi
    memory: 8Gi
