# Contradiction: a volume that outlives the container, on a server declared disposable.
# Expected: spec.storage.volume — must not be set when spec.storage.mode is `ephemeral`
apiVersion: mcorch.dev/v1alpha1
kind: PaperServer
metadata:
  name: lobby-01
spec:
  network:
    rcon:
      passwordSecret:
        name: lobby-01-rcon
        key: password
  eulaAccepted: true
  image: docker.io/itzg/minecraft-server:2026.6.1
  paper:
    minecraftVersion: "1.21.8"
  resources:
    memory: 2Gi
  storage:
    mode: ephemeral
    volume:
      name: lobby-01-world
      size: 10Gi
