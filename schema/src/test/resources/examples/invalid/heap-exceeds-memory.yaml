# A 4Gi heap in a 4Gi container is an OOM-kill mid-tick, not an OutOfMemoryError.
# Expected: spec.resources.heap.max — must leave headroom below the container memory limit
apiVersion: mcorch.dev/v1alpha1
kind: PaperServer
metadata:
  name: survival-01
spec:
  eulaAccepted: true
  image: docker.io/itzg/minecraft-server:2026.6.1
  paper:
    minecraftVersion: "1.21.8"
  resources:
    memory: 4Gi
    heap:
      max: 4Gi
