# buildSrc plus the Kotlin compiler on a default heap is a common CI OOM.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError

org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is deliberately NOT enabled yet. It works today (verified),
# but the protobuf Gradle plugin lands in :cri next and has a history of
# configuration-cache incompatibility. Turning it on now would mean the CRI
# proto pipeline appears to break the build when it is really just this flag.
# Enable it once :cri:generateProto is green:
#   org.gradle.configuration-cache=true

kotlin.code.style=official
