# Logging for the orchestrator. Read the third-party section before raising any
# level: one of those lines is a redaction control, not a matter of taste.
#
# Everything below can be overridden per-run with a system property of the same
# name, e.g. -Dorg.slf4j.simpleLogger.log.mcorch.cri.CriClient=debug to trace
# every CRI call.

# INFO is the whole lifecycle of a server: workload created, image pulled, drain
# started, container stopping, workload removed, definition purged — plus every
# WARN a failed pass records, which is what was missing when a bare
# `phase=UNKNOWN` had to be diagnosed with no log line to go with it.
org.slf4j.simpleLogger.defaultLogLevel=info

# ── third-party: a redaction control ─────────────────────────────────────────
#
# CLAUDE.md bans player names, UUIDs and addresses from logs, and invariant 4
# says the Velocity forwarding secret only ever travels through the secret
# store. Nothing this project writes logs any of them — :cri logs operation
# names, container IDs, status codes and durations, and never an env map or a
# command's output.
#
# gRPC and netty are a different matter. At DEBUG or TRACE they log frames, and
# a CreateContainer request carries the container's environment — which is
# exactly where an RCON password sits, resolved from the secret store moments
# before the call. Turning the root level up for a debugging session would
# otherwise put that password in the log, and this is not a leak anybody would
# think to look for. So these are pinned, and pinned *below* the root: raising
# `defaultLogLevel` cannot reach them.
#
# If you genuinely need gRPC wire tracing, do it on a scratch definition with a
# throwaway secret, and never on a host whose logs are shipped anywhere.
org.slf4j.simpleLogger.log.io.grpc=warn
org.slf4j.simpleLogger.log.io.netty=warn
org.slf4j.simpleLogger.log.org.xerial=warn

# ── format ───────────────────────────────────────────────────────────────────

# Absolute timestamps, because the thing these logs get correlated against is
# containerd's own journal. Elapsed-milliseconds-since-JVM-start, the default,
# cannot be lined up with anything.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX

# The loop runs a pool of workers over one queue, so which worker a line came
# from is how two interleaved servers are told apart.
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# One stream, in order. The integration harness prints its own progress to
# stdout, and diagnosing a run from two streams interleaved by the JVM's
# buffering is how the last one blamed the wrong component.
org.slf4j.simpleLogger.logFile=System.out
